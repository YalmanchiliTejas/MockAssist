[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-interviewEnv"
version = "0.1.0"
description = "Interviewenv environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    # Core OpenEnv runtime (provides FastAPI server + HTTP client types)
    # install from github
    # "openenv @ git+https://github.com/huggingface/OpenEnv.git",
    "openenv>=0.2.2",
    "openai>=1.0.0",
    # Environment-specific dependencies
    # Add all dependencies needed for your environment here
    # Examples:
    # "numpy>=1.19.0",
    # "torch>=2.0.0",
    # "gymnasium>=0.29.0",
    # "openspiel>=1.0.0",
    # "smolagents>=1.22.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m interviewEnv.server.app
server = "interviewEnv.server.app:main"

[tool.setuptools]
include-package-data = true
packages = [
    "interviewEnv",
    "interviewEnv.candidate",
    "interviewEnv.interviewer",
    "interviewEnv.server",
]
package-dir = { "interviewEnv" = ".", "interviewEnv.candidate" = "candidate", "interviewEnv.interviewer" = "interviewer", "interviewEnv.server" = "server" }
